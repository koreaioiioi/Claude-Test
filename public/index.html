<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>와인 목록</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🍷 내 와인 목록</h1>

    <form id="add-form" class="add-form">
      <input type="text" id="wine-input" placeholder="와인 이름을 입력하세요 (예: Chateau Margaux 2015)" autocomplete="off" required />
      <button type="submit">추가</button>
    </form>

    <p id="empty-message" class="empty-message" hidden>아직 등록된 와인이 없습니다.</p>
    <ul id="wine-list" class="wine-list"></ul>
  </div>

  <div id="label-tooltip" class="label-tooltip" hidden>
    <div class="label-tooltip-inner">
      <img id="label-image" alt="와인 라벨" />
      <p id="label-status" class="label-status"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
